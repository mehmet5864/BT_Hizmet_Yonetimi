<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 358" width="710" height="358" role="img"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs><rect width="710" height="358" fill="#ffffff"/><text x="30" y="34" font-size="18" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Çevik (Scrum) döngüsü</text><text x="30" y="56" font-size="12" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" >Sprint: 1-4 hafta, her sonunda kullanılabilir bir sonuç</text><rect x="30" y="80" width="190" height="92" rx="10" fill="#eff6ff" stroke="#047857" stroke-width="1.5"/><circle cx="46" cy="96" r="11" fill="#047857"/><text x="46" y="100" font-size="12" fill="#fff" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" font-weight="700">1</text><text x="64" y="101" font-size="12" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Ürün backlog'u</text><text x="42" y="124" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >Ürün sahibi hikâyeleri</text><text x="42" y="139" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >sıralar. Olay/değişiklikten iş</text><text x="42" y="154" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >açılabilir.</text><line x1="220" y1="126" x2="260" y2="126" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/><rect x="260" y="80" width="190" height="92" rx="10" fill="#eff6ff" stroke="#047857" stroke-width="1.5"/><circle cx="276" cy="96" r="11" fill="#047857"/><text x="276" y="100" font-size="12" fill="#fff" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" font-weight="700">2</text><text x="294" y="101" font-size="12" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Sprint planlama</text><text x="272" y="124" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >Ekip hedef belirler, işleri</text><text x="272" y="139" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >sprint'e alır, puanlar.</text><line x1="450" y1="126" x2="490" y2="126" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/><rect x="490" y="80" width="190" height="92" rx="10" fill="#eff6ff" stroke="#047857" stroke-width="1.5"/><circle cx="506" cy="96" r="11" fill="#047857"/><text x="506" y="100" font-size="12" fill="#fff" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" font-weight="700">3</text><text x="524" y="101" font-size="12" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Günlük toplantı</text><text x="502" y="124" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >Panoda iş: Yapılacak → Devam →</text><text x="502" y="139" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >Test → Bitti.</text><line x1="585" y1="172" x2="585" y2="226" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/><rect x="490" y="226" width="190" height="92" rx="10" fill="#eff6ff" stroke="#047857" stroke-width="1.5"/><circle cx="506" cy="242" r="11" fill="#047857"/><text x="506" y="246" font-size="12" fill="#fff" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" font-weight="700">4</text><text x="524" y="247" font-size="12" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Sprint gözden geçirme</text><text x="502" y="270" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >Biten işler paydaşlara</text><text x="502" y="285" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >gösterilir.</text><line x1="490" y1="272" x2="450" y2="272" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/><rect x="260" y="226" width="190" height="92" rx="10" fill="#eff6ff" stroke="#047857" stroke-width="1.5"/><circle cx="276" cy="242" r="11" fill="#047857"/><text x="276" y="246" font-size="12" fill="#fff" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" font-weight="700">5</text><text x="294" y="247" font-size="12" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Retrospektif</text><text x="272" y="270" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >Ne iyi gitti, ne düzeltilecek;</text><text x="272" y="285" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >aksiyonlar işe dönüşür.</text><line x1="260" y1="272" x2="220" y2="272" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/><rect x="30" y="226" width="190" height="92" rx="10" fill="#eff6ff" stroke="#047857" stroke-width="1.5"/><circle cx="46" cy="242" r="11" fill="#047857"/><text x="46" y="246" font-size="12" fill="#fff" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" font-weight="700">6</text><text x="64" y="247" font-size="12" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Ölçüm</text><text x="42" y="270" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >Burndown ve velocity ile</text><text x="42" y="285" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >tahmin yapılır.</text></svg>