<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 358" width="940" height="358" role="img"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs><rect width="940" height="358" fill="#ffffff"/><text x="30" y="34" font-size="18" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Değişiklik yönetimi akışı</text><text x="30" y="56" font-size="12" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" >Riski kontrol altında tutarak üretim ortamını değiştirmek</text><rect x="30" y="80" width="190" height="92" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><circle cx="46" cy="96" r="11" fill="#2563eb"/><text x="46" y="100" font-size="12" fill="#fff" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" font-weight="700">1</text><text x="64" y="101" font-size="12" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Talep</text><text x="42" y="124" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >Gerekçe, etki, geri dönüş</text><text x="42" y="139" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >planı ile kaydı aç.</text><line x1="220" y1="126" x2="260" y2="126" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/><rect x="260" y="80" width="190" height="92" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><circle cx="276" cy="96" r="11" fill="#2563eb"/><text x="276" y="100" font-size="12" fill="#fff" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" font-weight="700">2</text><text x="294" y="101" font-size="12" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Risk ve etki</text><text x="272" y="124" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >Konfigürasyon (CMDB)</text><text x="272" y="139" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >ilişkilerinden etkilenen</text><text x="272" y="154" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >sistemler.</text><line x1="450" y1="126" x2="490" y2="126" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/><rect x="490" y="80" width="190" height="92" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><circle cx="506" cy="96" r="11" fill="#2563eb"/><text x="506" y="100" font-size="12" fill="#fff" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" font-weight="700">3</text><text x="524" y="101" font-size="12" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Onay zinciri</text><text x="502" y="124" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >Birim amiri → bilgi güvenliği</text><text x="502" y="139" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >(Ayarlar'daki akış).</text><line x1="680" y1="126" x2="720" y2="126" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/><rect x="720" y="80" width="190" height="92" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><circle cx="736" cy="96" r="11" fill="#2563eb"/><text x="736" y="100" font-size="12" fill="#fff" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" font-weight="700">4</text><text x="754" y="101" font-size="12" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Zamanla</text><text x="732" y="124" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >Planlanan tarih, bakım</text><text x="732" y="139" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >penceresi, bildirim.</text><line x1="815" y1="172" x2="815" y2="226" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/><rect x="720" y="226" width="190" height="92" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><circle cx="736" cy="242" r="11" fill="#2563eb"/><text x="736" y="246" font-size="12" fill="#fff" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" font-weight="700">5</text><text x="754" y="247" font-size="12" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Uygula</text><text x="732" y="270" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >Teknisyen uygular, durumu</text><text x="732" y="285" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >günceller.</text><line x1="720" y1="272" x2="680" y2="272" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/><rect x="490" y="226" width="190" height="92" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><circle cx="506" cy="242" r="11" fill="#2563eb"/><text x="506" y="246" font-size="12" fill="#fff" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" font-weight="700">6</text><text x="524" y="247" font-size="12" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Doğrula</text><text x="502" y="270" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >Test sonucu ve geri dönüş</text><text x="502" y="285" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >gerekip gerekmediği.</text><line x1="490" y1="272" x2="450" y2="272" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/><rect x="260" y="226" width="190" height="92" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><circle cx="276" cy="242" r="11" fill="#2563eb"/><text x="276" y="246" font-size="12" fill="#fff" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" font-weight="700">7</text><text x="294" y="247" font-size="12" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Kapat</text><text x="272" y="270" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >Başarılı / başarısız.</text><text x="272" y="285" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >Değişiklik başarı raporuna</text><text x="272" y="300" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >girer.</text><line x1="260" y1="272" x2="220" y2="272" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/><rect x="30" y="226" width="190" height="92" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><circle cx="46" cy="242" r="11" fill="#2563eb"/><text x="46" y="246" font-size="12" fill="#fff" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" font-weight="700">8</text><text x="64" y="247" font-size="12" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Gözden geçir</text><text x="42" y="270" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >Başarısızlar için problem veya</text><text x="42" y="285" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >iyileştirme işi.</text></svg>