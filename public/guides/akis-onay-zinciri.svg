" y="226" width="190" height="92" rx="10" fill="#eff6ff" stroke="#0f766e" stroke-width="1.5"/><circle cx="46" cy="242" r="11" fill="#0f766e"/><text x="46" y="246" font-size="12" fill="#fff" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" font-weight="700">8</text><text x="64" y="247" font-size="12" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Reddedilirse</text><text x="42" y="270" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >Kayıt reddedilir; talep eden</text><text x="42" y="285" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >bilgilendirilir.</text></svg>