<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 358" width="940" height="358" role="img"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs><rect width="940" height="358" fill="#ffffff"/><text x="30" y="34" font-size="18" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Onay zinciri (iş akışı) nasıl çalışır</text><text x="30" y="56" font-size="12" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" >Ayarlar &gt; Yönetici onayları ve Ayarlar &gt; İş akışları</text><rect x="30" y="80" width="190" height="92" rx="10" fill="#eff6ff" stroke="#0f766e" stroke-width="1.5"/><circle cx="46" cy="96" r="11" fill="#0f766e"/><text x="46" y="100" font-size="12" fill="#fff" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" font-weight="700">1</text><text x="64" y="101" font-size="12" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Kayıt oluşur</text><text x="42" y="124" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >Talep, değişiklik veya yama</text><text x="42" y="139" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >bekleyen durumda açılır.</text><line x1="220" y1="126" x2="260" y2="126" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/><rect x="260" y="80" width="190" height="92" rx="10" fill="#eff6ff" stroke="#0f766e" stroke-width="1.5"/><circle cx="276" cy="96" r="11" fill="#0f766e"/><text x="276" y="100" font-size="12" fill="#fff" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" font-weight="700">2</text><text x="294" y="101" font-size="12" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Akış başlar</text><text x="272" y="124" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >Kayıt türüne ait etkin akış</text><text x="272" y="139" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >örneği oluşur.</text><line x1="450" y1="126" x2="490" y2="126" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/><rect x="490" y="80" width="190" height="92" rx="10" fill="#eff6ff" stroke="#0f766e" stroke-width="1.5"/><circle cx="506" cy="96" r="11" fill="#0f766e"/><text x="506" y="100" font-size="12" fill="#fff" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" font-weight="700">3</text><text x="524" y="101" font-size="12" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Onaycı bulunur</text><text x="502" y="124" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >Birim amiri, üst amir veya</text><text x="502" y="139" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >bilgi güvenliği.</text><line x1="680" y1="126" x2="720" y2="126" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/><rect x="720" y="80" width="190" height="92" rx="10" fill="#eff6ff" stroke="#0f766e" stroke-width="1.5"/><circle cx="736" cy="96" r="11" fill="#0f766e"/><text x="736" y="100" font-size="12" fill="#fff" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" font-weight="700">4</text><text x="754" y="101" font-size="12" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-weight="700">E-posta gider</text><text x="732" y="124" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >SMTP açıksa Onayla / Reddet</text><text x="732" y="139" font-size="11" fill="#475569" font-family="Segoe UI, Arial, sans-serif" >bağlantısı iletilir.</text><line x1="815" y1="172" x2="815" y2="226" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/><rect x="720" y="226" width="190" height="92" rx="10" fill="#eff6ff" stroke="#0f766e" stroke-width="1.5"/><circle cx="736" cy="242" r="11" fill="#0f766e"/><text x="736" y="246" font-size="12" fill="#fff" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" font-weight="700">5</text><text x=