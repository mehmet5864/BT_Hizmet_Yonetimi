 marker-start="url(#ar)" marker-end="url(#ar)"/><rect x="340" y="525" width="200" height="34" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="440" y="539" font-size="11" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" font-weight="700">HTTPS /api/v1</text><text x="440" y="553" font-size="10" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">Bearer anahtar</text><text x="30" y="658" font-size="11" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" >Oklar bağlantının yönünü gösterir. Güvenlik duvarında yalnızca belirtilen kaynak → hedef port açılır.</text></svg>