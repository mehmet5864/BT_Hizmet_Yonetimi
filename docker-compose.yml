# Docker Desktop: Linux containers + Compose V2. Windows'ta install-docker.bat.
name: bt-hizmet-yonetimi-v4

services:
  db:
    image: postgres:16-alpine
    container_name: bt-postgres-v4
    environment:
      POSTGRES_USER: bt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında tanımlı olmalı}
      POSTGRES_DB: bt
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=256MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bt -d bt"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  envanter:
    build:
      context: .
      dockerfile: Dockerfile
    image: envanter-yonetim:v4
    container_name: envanter-yonetim-v4
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "43130:43130"
    environment:
      DATABASE_URL: postgresql://bt:${POSTGRES_PASSWORD}@db:5432/bt
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      SESSION_SECRET: ${SESSION_SECRET:-envanter-yerel-oturum-gizli}
      SESSION_SECURE: ${SESSION_SECURE:-false}
      APP_URL: ${APP_URL:-http://127.0.0.1:43130}
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_DEMO_EXTRA: ${SEED_DEMO_EXTRA:-true}
      INTEGRATION_TLS_STRICT: ${INTEGRATION_TLS_STRICT:-false}
      PORT: "43130"
      PRISMA_HIDE_UPDATE_MESSAGE: "true"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    volumes:
      - envanter-data:/data
      - envanter-uploads:/app/public/uploads
    restart: unless-stopped
    # Güncelleme: docker compose up --build -d
    # Veriyi siler: docker compose down -v  (kullanmayın)

volumes:
  pgdata:
  envanter-data:
  envanter-uploads:
